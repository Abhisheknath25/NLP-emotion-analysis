<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Emotion Classification Using NLP & Machine Learning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-emojis">
        <div class="floating-emoji e-1">😊</div>
        <div class="floating-emoji e-2">😔</div>
        <div class="floating-emoji e-3">😠</div>
        <div class="floating-emoji e-4">❤️</div>
        <div class="floating-emoji e-5">😲</div>
        <div class="floating-emoji e-6">😨</div>
        <div class="floating-emoji e-7">😊</div>
        <div class="floating-emoji e-8">❤️</div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>Text Emotion Classification Using NLP & Machine Learning</h1>
            </div>
            <p class="subtitle">Understand the feelings behind the text.</p>
        </header>

        <main>
            <div class="input-section glass-panel">
                <textarea id="text-input" placeholder="Type or paste your text here..." rows="4"></textarea>
                <div class="actions">
                    <span class="char-count" id="char-count">0 characters</span>
                    <button id="analyze-btn" class="primary-btn">
                        <span>Analyze Emotion</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>

            <div id="results-section" class="results-section hidden">
                <div class="primary-result glass-panel">
                    <div class="emoji-display" id="result-emoji">😐</div>
                    <div class="emotion-details">
                        <h2 id="result-emotion">Analyzing...</h2>
                        <div class="confidence-bar-container">
                            <div class="confidence-bar" id="primary-confidence-bar"></div>
                        </div>
                        <p class="confidence-text"><span id="result-confidence">0</span>% Match</p>
                    </div>
                </div>

                <div class="other-emotions glass-panel">
                    <h3>Detailed Breakdown</h3>
                    <div class="emotions-grid" id="emotions-grid">
                        <!-- Filled via JS -->
                    </div>
                </div>
            </div>
            
            <div id="error-message" class="error-message hidden"></div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textInput = document.getElementById('text-input');
            const analyzeBtn = document.getElementById('analyze-btn');
            const charCount = document.getElementById('char-count');
            const resultsSection = document.getElementById('results-section');
            const resultEmoji = document.getElementById('result-emoji');
            const resultEmotion = document.getElementById('result-emotion');
            const resultConfidence = document.getElementById('result-confidence');
            const primaryConfidenceBar = document.getElementById('primary-confidence-bar');
            const emotionsGrid = document.getElementById('emotions-grid');
            const errorMessage = document.getElementById('error-message');

            const allEmojis = {
                'sadness': '😔',
                'anger': '😠',
                'love': '❤️',
                'surprise': '😲',
                'fear': '😨',
                'joy': '😊'
            };

            textInput.addEventListener('input', () => {
                const len = textInput.value.length;
                charCount.textContent = `${len} character${len !== 1 ? 's' : ''}`;
                
                if (len > 0) {
                    analyzeBtn.classList.add('active');
                } else {
                    analyzeBtn.classList.remove('active');
                }
            });

            analyzeBtn.addEventListener('click', async () => {
                const text = textInput.value;
                if (!text.trim()) return;

                // UI Loading state
                analyzeBtn.disabled = true;
                analyzeBtn.classList.add('loading');
                errorMessage.classList.add('hidden');
                
                try {
                    const response = await fetch('/predict', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'An error occurred during analysis.');
                    }

                    displayResults(data);

                } catch (error) {
                    errorMessage.textContent = error.message;
                    errorMessage.classList.remove('hidden');
                    resultsSection.classList.add('hidden');
                } finally {
                    analyzeBtn.disabled = false;
                    analyzeBtn.classList.remove('loading');
                }
            });

            function displayResults(data) {
                resultsSection.classList.remove('hidden');
                
                // Trigger animation
                resultsSection.classList.remove('fade-in');
                void resultsSection.offsetWidth; // trigger reflow
                resultsSection.classList.add('fade-in');

                resultEmoji.textContent = data.emoji;
                resultEmotion.textContent = data.emotion.charAt(0).toUpperCase() + data.emotion.slice(1);
                
                // Animate numbers
                animateValue(resultConfidence, 0, data.confidence, 1000);
                
                setTimeout(() => {
                    primaryConfidenceBar.style.width = `${data.confidence}%`;
                }, 100);

                // Populate grid
                emotionsGrid.innerHTML = '';
                
                // Sort confidences highest to lowest
                const sortedEmotions = Object.entries(data.all_confidences)
                    .sort(([,a], [,b]) => b - a);

                sortedEmotions.forEach(([emotion, conf]) => {
                    if (emotion === data.emotion) return; // Skip the primary one

                    const gridItem = document.createElement('div');
                    gridItem.className = 'emotion-row';
                    
                    const emName = emotion.charAt(0).toUpperCase() + emotion.slice(1);
                    const icon = allEmojis[emotion] || '😐';
                    
                    gridItem.innerHTML = `
                        <div class="row-label">
                            <span class="row-emoji">${icon}</span>
                            <span class="row-name">${emName}</span>
                        </div>
                        <div class="row-bar-container">
                            <div class="row-bar" style="width: 0%"></div>
                        </div>
                        <div class="row-value">${conf}%</div>
                    `;
                    
                    emotionsGrid.appendChild(gridItem);
                    
                    // Animate the bar
                    setTimeout(() => {
                        gridItem.querySelector('.row-bar').style.width = `${conf}%`;
                    }, 200);
                });
            }

            function animateValue(obj, start, end, duration) {
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    obj.innerHTML = (progress * (end - start) + start).toFixed(1);
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    }
                };
                window.requestAnimationFrame(step);
            }
        });
    </script>
</body>
</html>
